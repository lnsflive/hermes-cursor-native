name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv build

  bootstrap-syntax:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content -Raw install.ps1))'
      - name: POSIX syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh

  stock-hermes-contract:
    strategy:
      fail-fast: false
      matrix:
        hermes-ref: [ead7e91dabf1e963796ec834b196984a2fa44ff4, main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.11"
      - name: Clone stock Hermes Agent
        run: |
          git init "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth 1 origin "${{ matrix.hermes-ref }}"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach FETCH_HEAD
      - name: Install Hermes dependencies
        working-directory: ${{ runner.temp }}/hermes-agent
        run: uv sync --extra dev
      - name: Run plugin contract tests
        env:
          HERMES_AGENT_ROOT: ${{ runner.temp }}/hermes-agent
        run: |
          uv sync --extra dev
          uv run pytest -q tests/test_client_contract.py tests/test_auth_shim.py tests/test_ui_integration.py tests/test_native_plugin.py
