name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv build

  bootstrap-syntax:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content -Raw install.ps1))'
      - name: POSIX syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh

  hermes-patch-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.11"
      - name: Read declared Hermes base
        id: manifest
        run: |
          echo "base=$(python -c 'import json; print(json.load(open("install-manifest.json"))["base_commits"][0])')" >> "$GITHUB_OUTPUT"
      - name: Apply patch series
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout "${{ steps.manifest.outputs.base }}"
          python -c 'import json; print("\n".join(json.load(open("install-manifest.json"))["patch_series"]))' > "$RUNNER_TEMP/patch-series.txt"
          while IFS= read -r patch; do
            git -C "$RUNNER_TEMP/hermes-agent" am "$GITHUB_WORKSPACE/patches/hermes/0.20.5/$patch"
          done < "$RUNNER_TEMP/patch-series.txt"
      - name: Verify manifest-pinned provider blobs
        run: |
          python -c 'import hashlib,json,os,subprocess; m=json.load(open("install-manifest.json")); root=os.path.join(os.environ["RUNNER_TEMP"],"hermes-agent"); bad=[p for p,h in m["provider_file_sha256"].items() if hashlib.sha256(subprocess.check_output(["git","-C",root,"show",f"HEAD:{p}"])).hexdigest()!=h]; assert not bad, f"provider hash mismatch: {bad}"'
      - name: Install Hermes test dependencies
        working-directory: ${{ runner.temp }}/hermes-agent
        run: uv sync --extra dev
      - name: Run embedded Cursor tests
        working-directory: ${{ runner.temp }}/hermes-agent
        run: |
          uv run pytest -o addopts= -q \
            tests/agent/test_cursor_bridge_wire.py \
            tests/agent/test_cursor_bridge_transport.py \
            tests/agent/test_cursor_bridge_client.py \
            tests/agent/test_cursor_sdk_auth.py \
            tests/hermes_cli/test_cursor_provider.py \
            tests/cli/test_cli_provider_resolution.py
